<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>diff2text — Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>diff2text</h1>
      <span class="subtitle">Output template</span>
    </header>

    <section class="variables">
      <span class="section-label">Insert variable</span>
      <div class="chip-row">
        <button class="chip" data-var="PR_NUMBER" type="button">PR_NUMBER</button>
        <button class="chip" data-var="TITLE" type="button">TITLE</button>
        <button class="chip" data-var="AUTHOR" type="button">AUTHOR</button>
        <button class="chip" data-var="DESCRIPTION" type="button">DESCRIPTION</button>
        <button class="chip" data-var="DIFF" type="button">DIFF</button>
        <button class="chip" data-var="REPO" type="button">REPO</button>
        <button class="chip" data-var="OWNER" type="button">OWNER</button>
        <button class="chip" data-var="URL" type="button">URL</button>
      </div>
    </section>

    <section class="editor">
      <textarea id="config-text" rows="24" spellcheck="false"></textarea>
    </section>

    <div class="actions">
      <button id="save-btn" type="button" class="save-btn">Save</button>
      <span id="status"></span>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
